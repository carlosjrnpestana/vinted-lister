name: Publish Vinted Listing

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Listing Title'
        required: false
        type: string
      desc:
        description: 'Listing Description'
        required: false
        type: string
      category:
        description: 'Category Path'
        required: false
        type: string
      price:
        description: 'Price in EUR'
        required: false
        type: string
      brand:
        description: 'Brand (Optional)'
        required: false
        type: string
      image_urls:
        description: 'Comma-separated Image URLs'
        required: false
        type: string
      # Fallbacks for legacy uppercase inputs
      ITEM_TITLE:
        description: 'Legacy Listing Title'
        required: false
        type: string
      ITEM_DESC:
        description: 'Legacy Listing Description'
        required: false
        type: string
      ITEM_CATEGORY:
        description: 'Legacy Category Path'
        required: false
        type: string
      ITEM_PRICE:
        description: 'Legacy Price'
        required: false
        type: string
      ITEM_BRAND:
        description: 'Legacy Brand'
        required: false
        type: string
      IMAGE_URLS:
        description: 'Legacy Image URLs'
        required: false
        type: string

jobs:
  publish-listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Vinted Listing Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VINTED_COOKIES: ${{ secrets.VINTED_COOKIES }}
          ITEM_TITLE: ${{ inputs.title || inputs.ITEM_TITLE }}
          ITEM_DESC: ${{ inputs.desc || inputs.ITEM_DESC }}
          ITEM_CATEGORY: ${{ inputs.category || inputs.ITEM_CATEGORY }}
          ITEM_PRICE: ${{ inputs.price || inputs.ITEM_PRICE }}
          ITEM_BRAND: ${{ inputs.brand || inputs.ITEM_BRAND }}
          IMAGE_URLS: ${{ inputs.image_urls || inputs.IMAGE_URLS }}
        run: xvfb-run --auto-servernum -- npm start
