name: Create Vinted Listing
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Item Title'
        required: true
        type: string
      desc:
        description: 'Description'
        required: true
        type: string
      category:
        description: 'Category path (e.g., Women > Clothing > Sweaters)'
        required: true
        type: string
      price:
        description: 'Price'
        required: true
        type: string
      brand:
        description: 'Brand (Optional)'
        required: false
        default: ''
        type: string
      image_urls:
        description: 'Comma-separated public URLs of uploaded images'
        required: true
        type: string

jobs:
  publish-listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # Updated to fix GitHub's deprecation warning
      - run: npm install
      # Added --with-deps so Ubuntu installs the system libraries Chromium needs
      - run: npx playwright install --with-deps chromium 
      - run: npm start
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Added for Stagehand compatibility
          VINTED_COOKIES: ${{ secrets.VINTED_COOKIES }}
          ITEM_TITLE: ${{ inputs.title }}
          ITEM_DESC: ${{ inputs.desc }}
          ITEM_CATEGORY: ${{ inputs.category }}
          ITEM_PRICE: ${{ inputs.price }}
          ITEM_BRAND: ${{ inputs.brand }}
          IMAGE_URLS: ${{ inputs.image_urls }}
