name: Publish Vinted Listing

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Listing Title'
        required: false
        type: string
      desc:
        description: 'Listing Description'
        required: false
        type: string
      category:
        description: 'Category Path'
        required: false
        type: string
      price:
        description: 'Price in EUR'
        required: false
        type: string
      brand:
        description: 'Brand (Optional)'
        required: false
        type: string
      image_urls:
        description: 'Comma-separated Image URLs'
        required: false
        type: string
      ITEM_TITLE:
        description: 'Manual Trigger: Listing Title'
        required: false
        type: string
      ITEM_DESC:
        description: 'Manual Trigger: Listing Description'
        required: false
        type: string
      ITEM_CATEGORY:
        description: 'Manual Trigger: Category Path'
        required: false
        type: string
      ITEM_PRICE:
        description: 'Manual Trigger: Price'
        required: false
        type: string
      ITEM_BRAND:
        description: 'Manual Trigger: Brand'
        required: false
        type: string
      ITEM_IMAGE_URLS:
        description: 'Manual Trigger: Image URLs'
        required: false
        type: string

jobs:
  publish-listing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18'

    - name: Install dependencies
      run: npm install

    - name: Run Vinted Listing Automation
      env:
        BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
        # Optional BYOK — leave unset to use Browserbase Model Gateway on Free
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VINTED_COOKIES: ${{ secrets.VINTED_COOKIES }}
        # Free plan has no proxies — set repo var BROWSERBASE_PROXIES=true only on paid
        BROWSERBASE_PROXIES: ${{ vars.BROWSERBASE_PROXIES || 'false' }}
        ITEM_TITLE: ${{ inputs.title || inputs.ITEM_TITLE }}
        ITEM_DESC: ${{ inputs.desc || inputs.ITEM_DESC }}
        ITEM_CATEGORY: ${{ inputs.category || inputs.ITEM_CATEGORY }}
        ITEM_PRICE: ${{ inputs.price || inputs.ITEM_PRICE }}
        ITEM_BRAND: ${{ inputs.brand || inputs.ITEM_BRAND }}
        IMAGE_URLS: ${{ inputs.image_urls || inputs.ITEM_IMAGE_URLS }}
      run: |
        if [ -z "${BROWSERBASE_API_KEY:-}" ]; then
          echo "BROWSERBASE_API_KEY secret is required (Stagehand v4 + Browserbase)."
          exit 1
        fi
        echo "Running against Browserbase cloud browser"
        npm start
